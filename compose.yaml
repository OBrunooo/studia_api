services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        expose:
            - '80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - traefik # <-- CORREÇÃO 1: Adicionado à rede do Traefik
        depends_on:
            redis:
                condition: service_healthy
        restart: unless-stopped
        labels:
            - 'traefik.enable=true'
            - "traefik.docker.network=traefik" # Esta label agora vai funcionar corretamente!
            - "traefik.http.routers.laravel.rule=Host(`studia.vps-bruno-gomes.com`)"
            - "traefik.http.routers.laravel.entrypoints=websecure"
            - "traefik.http.routers.laravel.tls.certresolver=letsencrypt"
            - "traefik.http.services.laravel.loadbalancer.server.port=80"

    redis:
        image: 'redis:alpine'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
        restart: unless-stopped

    queue:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            SUPERVISOR_PHP_USER: root
        volumes:
            - '.:/var/www/html'
        networks:
            - sail # O queue não precisa da rede traefik, apenas da sail para falar com o Redis
        depends_on:
            redis:
                condition: service_healthy
            laravel.test:
                condition: service_started
        command: >
            php artisan queue:work redis
            --sleep=3
            --tries=1
            --timeout=1800
            --max-time=3600
            --verbose
        restart: unless-stopped

networks:
    sail:
        driver: bridge
    traefik: # <-- CORREÇÃO 2: Declarando a rede externa do Traefik neste projeto
        external: true

volumes:
    sail-redis:
        driver: local